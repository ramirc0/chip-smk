executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: unlimited
max-jobs-per-second: 5

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
# The plugin's 40 s default makes every seconds-long job cost at least 40 s.
slurm-init-seconds-before-status-checks: 10
# The plugin merges these with nodes that fail mid-run. An --exclude in
# slurm_extra would override both.
slurm-exclude-failed-nodes: z1024

default-resources:
  slurm_partition: 4hours
  runtime: 240m
  mem_mb: 8000 * attempt
  constraint: cascadelake
  slurm_extra: "--cpu-freq=High-High:Performance"

set-threads:              # single-threaded rules get the default, 1
  bowtie2_build: 22
  fastp_qc: 8
  align: 44
  xcor_tagalign: 22
  filter: 22
  tagalign: 8
  subsample_ta: 2
  pseudoreps: 2
  xcor: 2
  spp: 24
  frip: 2
  count_signal: 4
  jsd: 8

set-resources:              # from peak RSS and runtime of the ENCODE validation run; bowtie2_build,
                            # bwa_index and subsample_ta never ran there and keep starting values
  bowtie2_build:
    mem_mb: 16000 * attempt
  bwa_index:
    mem_mb: 8000 * attempt
    slurm_partition: 12hours
    runtime: 720m
  align:                  # 44 x 1536M of sort buffer, plus bowtie2
    mem_mb: 96000 * attempt
    slurm_partition: 12hours
    runtime: 720m
  xcor_tagalign:          # 22 x 1536M of sort buffer, plus bowtie2
    mem_mb: 40000 * attempt
    slurm_partition: 12hours
    runtime: 720m
  filter:                 # 22 x 2560M of name-sort buffer for pairs, plus overhead
    mem_mb: 80000 * attempt
  tagalign:
    mem_mb: 24000 * attempt
  subsample_ta:           # shuf -n holds ~172 B per sampled pair; 405M pairs took 70 GB
    mem_mb: 80000 * attempt
  pbc_qc:                 # paired-end bamtobed text is read whole
    mem_mb: 64000 * attempt
  spp:                    # 48 GB cgroup memory.peak at 24 threads; benchmarks miss the snow workers
    mem_mb: 64000 * attempt
    slurm_partition: 12hours
    runtime: 720m
  signal:
    mem_mb: 16000 * attempt

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-no-requeue: true
printshellcmds: true
latency-wait: 60
