# Local execution.
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

cores: 22
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:
  mem_mb: 8000
  runtime: 240

set-threads:              # single-threaded rules get the default, 1
  bowtie2_build: 22
  fastp_qc: 8
  align: 22
  xcor_tagalign: 22
  filter: 22
  tagalign: 8
  subsample_ta: 2
  pseudoreps: 2
  xcor: 2
  spp: 6
  frip: 2
  count_signal: 4
  jsd: 4

set-resources:              # from peak RSS of the ENCODE validation run; bowtie2_build and
                            # subsample_ta never ran there and keep starting values
  bowtie2_build: {mem_mb: 16000}
  align: {mem_mb: 64000}
  xcor_tagalign: {mem_mb: 16000}
  filter: {mem_mb: 48000}
  tagalign: {mem_mb: 24000}
  subsample_ta: {mem_mb: 24000}
  pbc_qc: {mem_mb: 24000}
  spp: {mem_mb: 32000}       # 26 GB cgroup memory.peak at 6 threads
  signal: {mem_mb: 16000}
